name: myntra-prod-b21

on: workflow_dispatch

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: docker build
        run: docker build -t myntra .

      - name: check docker image
        run: docker images

      - name: configure aws keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: push docker image to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 430155299210.dkr.ecr.ap-south-1.amazonaws.com
          docker tag myntra:latest 430155299210.dkr.ecr.ap-south-1.amazonaws.com/myntra:latest
          docker push 430155299210.dkr.ecr.ap-south-1.amazonaws.com/myntra:latest

      - name: Connect to EKS cluster
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name b21

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/app/